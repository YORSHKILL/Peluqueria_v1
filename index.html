<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peluquería Hombre - Reserva tu Cita</title>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #141414;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 10px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: #181818;
            padding: 35px 25px;
            border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.9), 0 0 25px rgba(212, 175, 55, 0.1);
            position: relative;
        }

        /* --- ENCABEZADO CON BARBER POLES --- */
        .header-title-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
            margin-bottom: 4px;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            color: #ffffff;
            text-align: center;
            letter-spacing: 0.5px;
            margin: 0;
        }

        .mini-pole-container {
            width: 22px;
            height: 48px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .barber-pole {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            transform: scale(0.075);
            transform-origin: center center;
            flex-shrink: 0;
        }

        .metal-cap {
            width: 140px;
            height: 140px;
            background: radial-gradient(circle at 45% 35%, #ffffff 0%, #e1e1e1 25%, #9e9e9e 60%, #4a4a4a 100%);
            border: 8px solid #000;
            border-radius: 50%;
            box-sizing: border-box;
            z-index: 2;
        }

        .metal-connector {
            width: 170px;
            height: 38px;
            background: linear-gradient(to right, #4a4a4a, #8e8e8e 15%, #ffffff 40%, #e1e1e1 60%, #8e8e8e 85%, #4a4a4a);
            border: 8px solid #000;
            border-radius: 6px;
            box-sizing: border-box;
            z-index: 3;
        }

        .top-connector { margin-top: -36px; margin-bottom: -8px; }
        .bottom-connector { margin-bottom: -36px; margin-top: -8px; }

        .glass-cylinder {
            width: 146px;
            height: 480px;
            border-left: 8px solid #000;
            border-right: 8px solid #000;
            position: relative;
            overflow: hidden;
            background-color: #fff;
            z-index: 1;
            box-sizing: border-box;
        }

        .stripes {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background: repeating-linear-gradient(
                135deg,
                #9b111e,
                #9b111e 40px,
                #ffffff 40px,
                #ffffff 80px,
                #124076 80px,
                #124076 120px,
                #ffffff 120px,
                #ffffff 160px
            );
            background-size: 100% 226.27px; 
            animation: rotate-pole 3s linear infinite;
        }

        .glass-shine {
            position: absolute;
            top: 0;
            left: 18%;
            width: 25px;
            height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0.75) 0%, rgba(255,255,255,0) 100%);
            z-index: 4;
            pointer-events: none;
        }

        .glass-shadow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, 
                rgba(0,0,0,0.35) 0%, 
                rgba(0,0,0,0) 12%, 
                rgba(0,0,0,0) 88%, 
                rgba(0,0,0,0.45) 100%
            );
            z-index: 3;
            pointer-events: none;
        }

        @keyframes rotate-pole {
            from { background-position: 0 0; }
            to { background-position: 0 -226.27px; }
        }

        /* --- BOTÓN ADMIN Y FORMULARIO --- */
        .admin-trigger {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.5);
            color: #d4af37;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .admin-trigger:hover {
            background: #d4af37;
            color: #000;
        }

        .admin-trigger.active {
            background: #81c784;
            color: #000;
            border-color: #81c784;
        }

        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #888888;
            margin-bottom: 25px;
        }

        .form-group { margin-bottom: 16px; }

        label {
            display: block;
            margin-bottom: 6px;
            color: #d4af37;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"], input[type="date"], select {
            width: 100%;
            padding: 12px;
            background-color: #222222;
            border: 1px solid #333333;
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            transition: all 0.2s;
        }

        input:focus, select:focus {
            border-color: #d4af37;
            outline: none;
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.3);
        }

        .reserve-button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #d4af37, #b89228);
            color: #000000;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            margin-bottom: 25px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.25);
        }

        .reserve-button:hover {
            transform: translateY(-1px);
            background: linear-gradient(135deg, #e5c158, #d4af37);
            box-shadow: 0 6px 18px rgba(212, 175, 55, 0.4);
        }

        .dashboard-stats {
            background: #121212;
            border: 1px solid #d4af37;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            display: none;
            justify-content: space-around;
        }

        .stat-box { text-align: center; }
        .stat-label { font-size: 10px; color: #888; text-transform: uppercase; }
        .stat-value { font-size: 15px; font-weight: bold; color: #81c784; }

        .calendar-section {
            border-top: 1px solid #2a2a2a;
            padding-top: 20px;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .nav-button {
            background-color: #262626;
            color: #d4af37;
            border: 1px solid #3b3b3b;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }

        .nav-button:hover { background-color: #333333; }

        .calendar-title {
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }

        .grid-header {
            text-align: center;
            font-weight: 600;
            font-size: 11px;
            color: #777;
            padding-bottom: 5px;
        }

        .grid-cell {
            padding: 9px 0;
            text-align: center;
            font-size: 13px;
            background-color: #202020;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            cursor: pointer;
            position: relative;
        }

        .grid-cell:hover { background-color: #2c2c2c; border-color: #555; }

        .grid-cell.other-month { opacity: 0.2; cursor: default; }

        .grid-cell.selected {
            background: #d4af37 !important;
            color: #000000 !important;
            font-weight: bold;
        }

        .has-bookings::after {
            content: '';
            position: absolute;
            bottom: 3px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            background-color: #d4af37;
            border-radius: 50%;
        }

        .day-details {
            background-color: #121212;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #252525;
            margin-top: 15px;
        }

        .day-details h4 {
            margin-bottom: 8px;
            font-size: 13px;
            color: #d4af37;
            border-bottom: 1px solid #222;
            padding-bottom: 4px;
        }

        #detailsContent { font-size: 12px; color: #aaa; }

        .booking-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1f1f1f;
            padding: 8px 10px;
            border-radius: 5px;
            margin-bottom: 5px;
            border-left: 3px solid #d4af37;
        }

        .booking-info strong { color: #fff; display: block; }
        .booking-info small { color: #888; }

        .delete-btn {
            background-color: #c62828;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }
    </style>
</head>
<body>

    <div class="container">
        <button id="adminBtn" class="admin-trigger">🔒 Admin</button>

        <div class="header-title-wrapper">
            <div class="mini-pole-container">
                <div class="barber-pole">
                    <div class="metal-cap"></div>
                    <div class="metal-connector top-connector"></div>
                    <div class="glass-cylinder">
                        <div class="stripes"></div>
                        <div class="glass-shine"></div>
                        <div class="glass-shadow"></div>
                    </div>
                    <div class="metal-connector bottom-connector"></div>
                    <div class="metal-cap"></div>
                </div>
            </div>

            <h1>Peluquería Hombre</h1>

            <div class="mini-pole-container">
                <div class="barber-pole">
                    <div class="metal-cap"></div>
                    <div class="metal-connector top-connector"></div>
                    <div class="glass-cylinder">
                        <div class="stripes"></div>
                        <div class="glass-shine"></div>
                        <div class="glass-shadow"></div>
                    </div>
                    <div class="metal-connector bottom-connector"></div>
                    <div class="metal-cap"></div>
                </div>
            </div>
        </div>

        <p class="subtitle">Reserva tu cita en pocos segundos</p>

        <div class="dashboard-stats" id="adminDashboard">
            <div class="stat-box">
                <div class="stat-label">Ingresos Hoy</div>
                <div class="stat-value" id="ingresosDia">$0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label" id="nombreMesAnio">Ingresos Mes</div>
                <div class="stat-value" id="ingresosMes">$0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Total Histórico</div>
                <div class="stat-value" id="totales">$0</div>
            </div>
        </div>

        <form id="formReserva">
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" placeholder="Ingresa tu nombre" required>
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono</label>
                <input type="text" id="telefono" placeholder="Ej. +56912345678" required>
            </div>

            <div class="form-group">
                <label for="servicio">Servicio</label>
                <select id="servicio" required>
                    <option value="">-- Selecciona un servicio --</option>
                    <option value="Corte de Cabello">Corte de Cabello ($8.000)</option>
                    <option value="Corte de Cabello / Barba">Corte de Cabello / Barba ($10.000)</option>
                </select>
            </div>

            <div class="form-group" style="display: flex; gap: 10px;">
                <div style="flex: 1;">
                    <label for="fecha">Fecha</label>
                    <input type="date" id="fecha" required>
                </div>
                <div style="flex: 1;">
                    <label for="hora">Hora</label>
                    <select id="hora" required>
                        <option value="">-- Elige hora --</option>
                        <option value="09:00">09:00 AM</option>
                        <option value="10:00">10:00 AM</option>
                        <option value="11:00">11:00 AM</option>
                        <option value="12:00">12:00 PM</option>
                        <option value="15:00">03:00 PM</option>
                        <option value="16:00">04:00 PM</option>
                        <option value="17:00">05:00 PM</option>
                        <option value="18:00">06:00 PM</option>
                        <option value="19:00">07:00 PM</option>
                        <option value="20:00">08:00 PM</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="reserve-button" id="btnReserva">Reservar Hora</button>
        </form>

        <div class="calendar-section">
            <div class="calendar-header">
                <button class="nav-button" id="prevMonth">◀ Anterior</button>
                <div class="calendar-title" id="calendarTitle">Cargando...</div>
                <button class="nav-button" id="nextMonth">Siguiente ▶</button>
            </div>

            <div class="calendar-grid" id="calendarGrid"></div>
        </div>

        <div class="day-details">
            <h4 id="detailsTitle">Selecciona un día en el calendario</h4>
            <div id="detailsContent">Haz clic en una fecha para ver disponibilidades.</div>
        </div>
    </div>

    <script>
        // 🔑 CONFIGURACIÓN OFICIAL DE SUPABASE (PROYECTO PELUQUERÍA)
        const SUPABASE_URL = "https://mfvxrdgkasahmfstcrhd.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1mdnhyZGdrYXNhaG1mc3RjcmhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzMTQxMDEsImV4cCI6MjA5OTg5MDEwMX0.t4kakqdM5zXslqSB4cOFzuQSInDnKIHUW0CfjwQy-1g";

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const ADMIN_PIN = "1234";
        let isAdminMode = false;
        let citas = [];
        let currentDate = new Date();
        let currentMonth = currentDate.getMonth();
        let currentYear = currentDate.getFullYear();
        let selectedDateStr = "";

        const mesesNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
        const diasSemana = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];

        document.addEventListener('DOMContentLoaded', () => {
            const hoyStr = new Date().toISOString().split('T')[0];
            document.getElementById('fecha').min = hoyStr;

            document.getElementById('adminBtn').addEventListener('click', toggleAdminMode);

            document.getElementById('fecha').addEventListener('change', (e) => {
                const formDate = e.target.value;
                if (formDate) {
                    selectedDateStr = formDate;
                    const dateParts = formDate.split('-');
                    currentYear = parseInt(dateParts[0]);
                    currentMonth = parseInt(dateParts[1]) - 1;
                    renderCalendar();
                    mostrarDetallesDia(selectedDateStr);
                }
            });

            document.getElementById('prevMonth').addEventListener('click', () => {
                currentMonth--;
                if (currentMonth < 0) { currentMonth = 11; currentYear--; }
                renderCalendar();
            });

            document.getElementById('nextMonth').addEventListener('click', () => {
                currentMonth++;
                if (currentMonth > 11) { currentMonth = 0; currentYear++; }
                renderCalendar();
            });

            document.getElementById('formReserva').addEventListener('submit', guardarReserva);

            cargarCitasDesdeSupabase();
        });

        function toggleAdminMode() {
            const btn = document.getElementById('adminBtn');
            const dashboard = document.getElementById('adminDashboard');

            if (isAdminMode) {
                isAdminMode = false;
                btn.innerText = "🔒 Admin";
                btn.classList.remove('active');
                dashboard.style.display = "none";
                if (selectedDateStr) mostrarDetallesDia(selectedDateStr);
            } else {
                const pin = prompt("Ingresa el PIN de administración:");
                if (pin === ADMIN_PIN) {
                    isAdminMode = true;
                    btn.innerText = "🔓 Modo Admin";
                    btn.classList.add('active');
                    dashboard.style.display = "flex";
                    if (selectedDateStr) mostrarDetallesDia(selectedDateStr);
                } else if (pin !== null) {
                    alert("PIN incorrecto.");
                }
            }
        }

        async function cargarCitasDesdeSupabase() {
            try {
                const { data, error } = await supabaseClient.from('reservas').select('*');
                if (error) throw error;
                citas = data || [];
                renderCalendar();
                calcularIngresosDashboard();
                if (selectedDateStr) mostrarDetallesDia(selectedDateStr);
            } catch (err) {
                console.error("Error conectando a Supabase:", err);
            }
        }

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            const title = document.getElementById('calendarTitle');
            grid.innerHTML = '';
            title.innerText = `${mesesNames[currentMonth]} ${currentYear}`;

            diasSemana.forEach(dia => {
                const dHeader = document.createElement('div');
                dHeader.className = 'grid-header';
                dHeader.innerText = dia;
                grid.appendChild(dHeader);
            });

            const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'grid-cell other-month';
                grid.appendChild(emptyCell);
            }

            for (let day = 1; day <= totalDays; day++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                cell.innerText = day;

                const fMonth = String(currentMonth + 1).padStart(2, '0');
                const fDay = String(day).padStart(2, '0');
                const dateStr = `${currentYear}-${fMonth}-${fDay}`;

                if (citas.some(c => c.fecha === dateStr)) {
                    cell.classList.add('has-bookings');
                }

                if (dateStr === selectedDateStr) {
                    cell.classList.add('selected');
                }

                cell.addEventListener('click', () => {
                    document.querySelectorAll('.grid-cell').forEach(el => el.classList.remove('selected'));
                    cell.classList.add('selected');
                    selectedDateStr = dateStr;
                    mostrarDetallesDia(dateStr);
                    document.getElementById('fecha').value = dateStr;
                });

                grid.appendChild(cell);
            }
        }

        function mostrarDetallesDia(dateStr) {
            const title = document.getElementById('detailsTitle');
            const content = document.getElementById('detailsContent');
            const [anio, mes, dia] = dateStr.split('-');
            title.innerText = `Horarios: ${dia}/${mes}/${anio}`;

            const filtradas = citas.filter(c => c.fecha === dateStr)
                                   .sort((a,b) => a.hora.localeCompare(b.hora));

            if (filtradas.length === 0) {
                content.innerHTML = "No hay reservas registradas para este día.";
                return;
            }

            content.innerHTML = '';
            filtradas.forEach(cita => {
                const item = document.createElement('div');
                item.className = 'booking-item';

                if (isAdminMode) {
                    item.innerHTML = `
                        <div class="booking-info">
                            <strong>⏰ ${cita.hora} hrs — ${cita.nombre}</strong>
                            <small>📞 ${cita.telefono} | 💇 ${cita.servicio}</small>
                        </div>
                        <button class="delete-btn" onclick="eliminarCita('${cita.id}')">Cancelar</button>
                    `;
                } else {
                    item.innerHTML = `
                        <div class="booking-info">
                            <strong>⏰ ${cita.hora} hrs — Horario Reservado</strong>
                            <small>No disponible</small>
                        </div>
                    `;
                }
                content.appendChild(item);
            });
        }

        function calcularIngresosDashboard() {
            let totalHoy = 0, totalMes = 0, totalHistorico = 0;
            const hoyStr = new Date().toISOString().split('T')[0];
            const mesActualStr = String(new Date().getMonth() + 1).padStart(2, '0');
            const anioActualStr = String(new Date().getFullYear());

            document.getElementById('nombreMesAnio').innerText = `Mes (${mesesNames[new Date().getMonth()]})`;

            citas.forEach(cita => {
                const valor = (cita.servicio.includes("Barba") || cita.servicio.includes("10.000")) ? 10000 : 8000;
                totalHistorico += valor;
                if (cita.fecha === hoyStr) totalHoy += valor;
                const [cAnio, cMes] = cita.fecha.split('-');
                if (cMes === mesActualStr && cAnio === anioActualStr) totalMes += valor;
            });

            document.getElementById('ingresosDia').innerText = `$${totalHoy.toLocaleString('es-CL')}`;
            document.getElementById('ingresosMes').innerText = `$${totalMes.toLocaleString('es-CL')}`;
            document.getElementById('totales').innerText = `$${totalHistorico.toLocaleString('es-CL')}`;
        }

        async function guardarReserva(e) {
            e.preventDefault();
            const btn = document.getElementById('btnReserva');
            btn.disabled = true;
            btn.innerText = "Reservando...";

            const nombre = document.getElementById('nombre').value;
            const telefono = document.getElementById('telefono').value;
            const servicio = document.getElementById('servicio').value;
            const fecha = document.getElementById('fecha').value;
            const hora = document.getElementById('hora').value;

            if (citas.some(c => c.fecha === fecha && c.hora === hora)) {
                alert("Este horario ya está ocupado.");
                btn.disabled = false;
                btn.innerText = "Reservar Hora";
                return;
            }

            try {
                const { error } = await supabaseClient.from('reservas').insert([{ nombre, telefono, servicio, fecha, hora }]);
                if (error) { 
                    alert("Error al guardar en Supabase: " + error.message); 
                } else {
                    alert("¡Cita agendada con éxito!");
                    document.getElementById('formReserva').reset();
                    await cargarCitasDesdeSupabase();
                }
            } catch (err) {
                alert("Ocurrió un error inesperado al conectar con Supabase.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Reservar Hora";
            }
        }

        window.eliminarCita = async function(id) {
            if (confirm("¿Cancelar esta reserva?")) {
                const { error } = await supabaseClient.from('reservas').delete().eq('id', id);
                if (error) { alert("Error: " + error.message); return; }
                await cargarCitasDesdeSupabase();
            }
        }
    </script>
</body>
</html>
