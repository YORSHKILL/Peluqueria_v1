<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peluquería Hombre - Sistema de Reservas en Línea</title>
    <!-- Cargamos la librería oficial de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Estilos generales con fondo oscuro y textura elegante de barbería */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), url('https://images.unsplash.com/photo-1503951914875-452162b0f3f1?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: #f5f5f5; 
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .main-wrapper {
            display: flex;
            align-items: flex-start;
            gap: 25px; 
            margin-top: 20px;
            margin-bottom: 40px;
            max-width: 100%;
        }

        /* Postes de barbero animados con rotación continua */
        .barber-pole-container {
            width: 65px;
            height: 450px;
            border-radius: 35px;
            overflow: hidden;
            background-color: #f0f0f0;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            position: relative;
            border: 2px solid #444;
            flex-shrink: 0;
        }

        .barber-pole-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 200%; 
            background-image: linear-gradient(
                45deg,
                #ffffff 25%,
                #d32f2f 25%,
                #d32f2f 50%,
                #ffffff 50%,
                #ffffff 75%,
                #1976d2 75%,
                #1976d2
            );
            background-size: 65px 65px; 
            animation: barberPoleSpin 2.5s linear infinite;
        }

        @keyframes barberPoleSpin {
            0% { transform: translateY(0); }
            100% { transform: translateY(-65px); }
        }

        .barber-pole-cap {
            position: absolute;
            width: 100%;
            height: 25px;
            background: linear-gradient(to bottom, #e0e0e0, #999);
            border-radius: 35px 35px 0 0;
            z-index: 2;
        }

        .barber-pole-cap-bottom {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 25px;
            background: linear-gradient(to top, #e0e0e0, #999);
            border-radius: 0 0 35px 35px;
            z-index: 2;
        }

        /* Panel central translúcido difuminado */
        .content-container {
            width: 580px;
            background-color: rgba(24, 24, 24, 0.88); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
        }

        /* Botón de acceso secreto Admin en la esquina */
        .admin-trigger {
            position: absolute;
            top: 15px;
            right: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #888;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .admin-trigger:hover {
            color: #fff;
            background: rgba(211, 47, 47, 0.3);
            border-color: #d32f2f;
        }

        .admin-trigger.active {
            color: #81c784;
            border-color: #81c784;
            background: rgba(129, 199, 132, 0.1);
        }

        h1 {
            text-align: center;
            font-size: 32px;
            margin: 0 0 5px 0;
            color: #ffffff;
            letter-spacing: 1px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.6);
        }

        .subtitle {
            text-align: center;
            font-size: 15px;
            color: #b3b3b3;
            margin-bottom: 30px;
        }

        /* Estilos del Formulario de Reserva */
        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #e0e0e0;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"], input[type="date"], select {
            width: 100%;
            padding: 12px 15px;
            background-color: rgba(38, 38, 38, 0.85);
            border: 1px solid #444;
            border-radius: 6px;
            color: #ffffff;
            box-sizing: border-box; 
            font-size: 15px;
            transition: all 0.3s ease;
        }

        input[type="text"]::placeholder {
            color: #777;
        }

        input:focus, select:focus {
            border-color: #d32f2f;
            background-color: rgba(45, 45, 45, 0.95);
            outline: none;
            box-shadow: 0 0 8px rgba(211, 47, 47, 0.4);
        }

        .reserve-button {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #d32f2f, #b71c1c);
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 25px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(211, 47, 47, 0.3);
            transition: all 0.3s ease;
        }

        .reserve-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(211, 47, 47, 0.5);
            background: linear-gradient(135deg, #e53935, #c62828);
        }

        /* Panel de Control de Ingresos (Oculto para el cliente) */
        .dashboard-stats {
            background: linear-gradient(135deg, rgba(32, 32, 32, 0.9), rgba(40, 40, 40, 0.9));
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 25px;
            display: none; /* Se activa solo en Modo Admin */
            justify-content: space-between;
            align-items: center;
        }

        .stat-box {
            text-align: center;
            flex: 1;
        }

        .stat-box:not(:last-child) {
            border-right: 1px solid rgba(255,255,255,0.1);
        }

        .stat-label {
            font-size: 11px;
            text-transform: uppercase;
            color: #aaa;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 18px;
            font-weight: bold;
            color: #81c784;
        }

        /* Calendario Visual e Interactivo */
        .calendar-section {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 25px;
            margin-bottom: 20px;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .nav-button {
            background-color: rgba(60, 60, 60, 0.8);
            color: #ffffff;
            border: 1px solid #555;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .nav-button:hover {
            background-color: #505050;
            border-color: #777;
        }

        .calendar-title {
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }

        .grid-header {
            background-color: rgba(28, 28, 28, 0.9);
            padding: 10px 0;
            text-align: center;
            font-weight: bold;
            font-size: 13px;
            color: #a0a0a0;
            border-radius: 4px;
        }

        .grid-cell {
            padding: 14px 0;
            text-align: center;
            font-size: 14px;
            background-color: rgba(45, 45, 45, 0.6);
            border: 1px solid rgba(255,255,255,0.02);
            border-radius: 6px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
        }

        .grid-cell:hover {
            background-color: rgba(70, 70, 70, 0.8);
            transform: scale(1.03);
        }

        .grid-cell.other-month {
            color: #444;
            cursor: default;
            background-color: transparent;
            border: none;
        }
        
        .grid-cell.other-month:hover {
            background-color: transparent;
            transform: none;
        }

        .grid-cell.selected {
            background: linear-gradient(135deg, #d32f2f, #b71c1c) !important;
            color: #fff;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(211, 47, 47, 0.5);
        }

        /* Círculo indicador de reservas del día */
        .has-bookings::after {
            content: '';
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 6px;
            background-color: #ff5252;
            border-radius: 50%;
            box-shadow: 0 0 4px #ff5252;
        }

        /* Lista de citas agendadas */
        .day-details {
            background-color: rgba(33, 33, 33, 0.9);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 15px;
        }

        .day-details h4 {
            margin: 0 0 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
            font-size: 15px;
            color: #e0e0e0;
            letter-spacing: 0.3px;
        }

        #detailsContent {
            font-size: 14px;
            color: #b0b0b0;
            line-height: 1.5;
        }

        .booking-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(20, 20, 20, 0.6);
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 8px;
            border-left: 4px solid #d32f2f;
        }

        .booking-info strong {
            color: #fff;
            font-size: 15px;
        }

        .booking-info small {
            color: #aaa;
            display: block;
            margin-top: 2px;
        }

        .delete-btn {
            background-color: #b71c1c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .delete-btn:hover {
            background-color: #e53935;
        }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <!-- Poste Izquierdo -->
        <div class="barber-pole-container">
            <div class="barber-pole-cap"></div>
            <div class="barber-pole-cap-bottom"></div>
        </div>

        <!-- Contenedor Principal -->
        <div class="content-container">
            <!-- Botón Discreto para Administrador -->
            <button id="adminBtn" class="admin-trigger" onclick="toggleAdminMode()">🔒 Admin</button>

            <h1>Peluquería Hombre</h1>
            <p class="subtitle">Reserva tu cita en pocos segundos</p>

            <!-- Dashboard de ingresos (Solo visible si es Admin) -->
            <div class="dashboard-stats" id="adminDashboard">
                <div class="stat-box">
                    <div class="stat-label">Ingresos Hoy</div>
                    <div class="stat-value" id="ingresosDia">$0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label" id="nombreMesAnio">Ingresos Mes</div>
                    <div class="stat-value" id="ingresosMes">$0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Total Histórico</div>
                    <div class="stat-value" id="totales">$0</div>
                </div>
            </div>

            <!-- Formulario de Entrada -->
            <form id="formReserva">
                <div class="form-group">
                    <label for="nombre">Nombre de Cliente</label>
                    <input type="text" id="nombre" placeholder="Ej. Juan Pérez" required>
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono de Contacto</label>
                    <input type="text" id="telefono" placeholder="Ej. +56912345678" required>
                </div>

                <div class="form-group">
                    <label for="servicio">Servicio a Realizar</label>
                    <select id="servicio" required>
                        <option value="">-- Selecciona un servicio --</option>
                        <option value="Corte de Cabello">Corte de Cabello ($8.000)</option>
                        <option value="Corte de Cabello / Barba">Corte de Cabello / Barba ($10.000)</option>
                    </select>
                </div>

                <div class="form-group" style="display: flex; gap: 15px;">
                    <div style="flex: 1;">
                        <label for="fecha">Fecha</label>
                        <input type="date" id="fecha" required>
                    </div>
                    <div style="flex: 1;">
                        <label for="hora">Hora</label>
                        <select id="hora" required>
                            <option value="">-- Elige hora --</option>
                            <option value="09:00">09:00 AM</option>
                            <option value="10:00">10:00 AM</option>
                            <option value="11:00">11:00 AM</option>
                            <option value="12:00">12:00 PM</option>
                            <option value="15:00">03:00 PM</option>
                            <option value="16:00">04:00 PM</option>
                            <option value="17:00">05:00 PM</option>
                            <option value="18:00">06:00 PM</option>
                            <option value="19:00">07:00 PM</option>
                            <option value="20:00">08:00 PM</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="reserve-button">Confirmar y Reservar Hora</button>
            </form>

            <!-- Sección de Calendario Dinámico -->
            <div class="calendar-section">
                <div class="calendar-header">
                    <button class="nav-button" id="prevMonth">◀ Ant</button>
                    <div class="calendar-title" id="calendarTitle">Mes Año</div>
                    <button class="nav-button" id="nextMonth">Sig ▶</button>
                </div>

                <div class="calendar-grid" id="calendarGrid"></div>
            </div>

            <!-- Bloque de Detalle de Citas del Día -->
            <div class="day-details">
                <h4 id="detailsTitle">Selecciona un día en el calendario</h4>
                <div id="detailsContent">Haz clic sobre cualquier fecha para consultar la disponibilidad de horarios.</div>
            </div>
        </div>

        <!-- Poste Derecho -->
        <div class="barber-pole-container">
            <div class="barber-pole-cap"></div>
            <div class="barber-pole-cap-bottom"></div>
        </div>
    </div>

    <script>
        // =========================================================
        // CONEXIÓN CON TU PROYECTO DE SUPABASE
        // =========================================================
        const SUPABASE_URL = "https://mfvxrdgkasahmfstcrhd.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_8IGgK5Uisvx-t91HWf1rIqw_Hp8h21zN3U3g3M3c5W6k7X"; 

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Clave PIN de administrador (Puedes cambiarla aquí si deseas)
        const ADMIN_PIN = "Nico2530";
        let isAdminMode = false;

        let citas = [];
        let currentDate = new Date();
        let currentMonth = currentDate.getMonth();
        let currentYear = currentDate.getFullYear();
        let selectedDateStr = "";

        const mesesNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
        const diasSemana = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];

        window.addEventListener('DOMContentLoaded', async () => {
            // Fecha mínima: el día de hoy
            const hoyStr = new Date().toISOString().split('T')[0];
            document.getElementById('fecha').min = hoyStr;

            // Sincronizar calendario al cambiar la fecha en el formulario
            document.getElementById('fecha').addEventListener('change', (e) => {
                const formDate = e.target.value;
                if (formDate) {
                    selectedDateStr = formDate;
                    const dateParts = formDate.split('-');
                    currentYear = parseInt(dateParts[0]);
                    currentMonth = parseInt(dateParts[1]) - 1;
                    renderCalendar();
                    mostrarDetallesDia(selectedDateStr);
                }
            });

            // Cargar citas iniciales
            await cargarCitasDesdeSupabase();
        });

        // Activar o Desactivar el Modo Administrador con clave
        window.toggleAdminMode = function() {
            const btn = document.getElementById('adminBtn');
            const dashboard = document.getElementById('adminDashboard');

            if (isAdminMode) {
                // Cerrar modo Admin
                isAdminMode = false;
                btn.innerText = "🔒 Admin";
                btn.classList.remove('active');
                dashboard.style.display = "none";
                if (selectedDateStr) mostrarDetallesDia(selectedDateStr);
                alert("Has salido del modo administración.");
            } else {
                // Pedir PIN secreto
                const pin = prompt("Ingresa el PIN de administración:");
                if (pin === ADMIN_PIN) {
                    isAdminMode = true;
                    btn.innerText = "🔓 Modo Admin";
                    btn.classList.add('active');
                    dashboard.style.display = "flex";
                    if (selectedDateStr) mostrarDetallesDia(selectedDateStr);
                    alert("¡Bienvenido! Modo Administrador activado.");
                } else if (pin !== null) {
                    alert("PIN incorrecto. Acceso denegado.");
                }
            }
        };

        // Traer todas las citas desde Supabase
        async function cargarCitasDesdeSupabase() {
            const { data, error } = await supabase
                .from('reservas')
                .select('*');
            
            if (error) {
                console.error("Error cargando base de datos:", error);
                return;
            }

            citas = data || [];
            renderCalendar();
            calcularIngresosDashboard();

            if (selectedDateStr) {
                mostrarDetallesDia(selectedDateStr);
            }
        }

        // Suscripción Realtime
        supabase
            .channel('schema-db-changes')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'reservas' }, () => {
                cargarCitasDesdeSupabase();
            })
            .subscribe();

        // Control de los meses del calendario
        document.getElementById('prevMonth').addEventListener('click', () => {
            currentMonth--;
            if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCalendar();
        });

        document.getElementById('nextMonth').addEventListener('click', () => {
            currentMonth++;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            renderCalendar();
        });

        // Dibujar el calendario en pantalla
        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            const title = document.getElementById('calendarTitle');
            grid.innerHTML = '';
            title.innerText = `${mesesNames[currentMonth]} ${currentYear}`;

            diasSemana.forEach(dia => {
                const dHeader = document.createElement('div');
                dHeader.className = 'grid-header';
                dHeader.innerText = dia;
                grid.appendChild(dHeader);
            });

            const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'grid-cell other-month';
                grid.appendChild(emptyCell);
            }

            for (let day = 1; day <= totalDays; day++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                cell.innerText = day;

                const fMonth = String(currentMonth + 1).padStart(2, '0');
                const fDay = String(day).padStart(2, '0');
                const dateStr = `${currentYear}-${fMonth}-${fDay}`;

                const tieneCita = citas.some(c => c.fecha === dateStr);
                if (tieneCita) {
                    cell.classList.add('has-bookings');
                }

                if (dateStr === selectedDateStr) {
                    cell.classList.add('selected');
                }

                cell.addEventListener('click', () => {
                    document.querySelectorAll('.grid-cell').forEach(el => el.classList.remove('selected'));
                    cell.classList.add('selected');
                    selectedDateStr = dateStr;
                    mostrarDetallesDia(dateStr);
                    document.getElementById('fecha').value = dateStr;
                });

                grid.appendChild(cell);
            }
        }

        // Mostrar detalles de la reserva respetando el permiso de Admin
        function mostrarDetallesDia(dateStr) {
            const title = document.getElementById('detailsTitle');
            const content = document.getElementById('detailsContent');
            const [anio, mes, dia] = dateStr.split('-');
            title.innerText = `Horarios para el día ${dia}/${mes}/${anio}`;

            const filtradas = citas.filter(c => c.fecha === dateStr)
                                   .sort((a,b) => a.hora.localeCompare(b.hora));

            if (filtradas.length === 0) {
                content.innerHTML = "No hay reservas registradas para este día. ¡Todos los horarios están disponibles!";
                return;
            }

            content.innerHTML = '';

            filtradas.forEach(cita => {
                const item = document.createElement('div');
                item.className = 'booking-item';

                if (isAdminMode) {
                    // Vista del Administrador: muestra datos personales y botón para cancelar
                    item.innerHTML = `
                        <div class="booking-info">
                            <strong>⏰ ${cita.hora} hrs — ${cita.nombre}</strong>
                            <small>📞 Tel: ${cita.telefono} | 💇 Servicio: ${cita.servicio}</small>
                        </div>
                        <button class="delete-btn" onclick="eliminarCita('${cita.id}')">Cancelar</button>
                    `;
                } else {
                    // Vista del Cliente: solo muestra que el horario está reservado (protege la privacidad)
                    item.innerHTML = `
                        <div class="booking-info">
                            <strong>⏰ ${cita.hora} hrs — Horario Reservado</strong>
                            <small>Este bloque ya no se encuentra disponible</small>
                        </div>
                    `;
                }
                content.appendChild(item);
            });
        }

        // Cálculo de los ingresos del negocio
        function calcularIngresosDashboard() {
            let totalHoy = 0;
            let totalMes = 0;
            let totalHistorico = 0;

            const hoyStr = new Date().toISOString().split('T')[0];
            const mesActualStr = String(new Date().getMonth() + 1).padStart(2, '0');
            const anioActualStr = String(new Date().getFullYear());

            document.getElementById('nombreMesAnio').innerText = `Ingresos ${mesesNames[new Date().getMonth()]}`;

            citas.forEach(cita => {
                let valor = 0;
                if (cita.servicio.includes("Barba") || cita.servicio.includes("10.000")) {
                    valor = 10000;
                } else {
                    valor = 8000;
                }

                totalHistorico += valor;

                if (cita.fecha === hoyStr) {
                    totalHoy += valor;
                }

                const [cAnio, cMes] = cita.fecha.split('-');
                if (cMes === mesActualStr && cAnio === anioActualStr) {
                    totalMes += valor;
                }
            });

            document.getElementById('ingresosDia').innerText = `$${totalHoy.toLocaleString('es-CL')}`;
            document.getElementById('ingresosMes').innerText = `$${totalMes.toLocaleString('es-CL')}`;
            document.getElementById('totales').innerText = `$${totalHistorico.toLocaleString('es-CL')}`;
        }

        // Guardar nueva reserva
        document.getElementById('formReserva').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nombre = document.getElementById('nombre').value;
            const telefono = document.getElementById('telefono').value;
            const servicio = document.getElementById('servicio').value;
            const fecha = document.getElementById('fecha').value;
            const hora = document.getElementById('hora').value;

            // Bloquear reservas duplicadas en la misma fecha y hora
            const ocupado = citas.some(c => c.fecha === fecha && c.hora === hora);
            if (ocupado) {
                alert("Lo sentimos, este horario ya está reservado. Por favor selecciona otra hora.");
                return;
            }

            const { error } = await supabase
                .from('reservas')
                .insert([{ nombre, telefono, servicio, fecha, hora }]);

            if (error) {
                alert("Error al guardar en la nube: " + error.message);
                return;
            }

            alert("¡Cita agendada con éxito! Ya ha sido confirmada en el sistema.");
            document.getElementById('formReserva').reset();
            await cargarCitasDesdeSupabase();
        });

        // Eliminar/Cancelar cita (disponible únicamente desde el panel de Admin)
        window.eliminarCita = async function(id) {
            if (confirm("¿Estás seguro de que deseas cancelar esta reserva del sistema?")) {
                const { error } = await supabase
                    .from('reservas')
                    .delete()
                    .eq('id', id);

                if (error) {
                    alert("No se pudo eliminar la cita: " + error.message);
                    return;
                }

                alert("Reserva cancelada correctamente.");
                await cargarCitasDesdeSupabase();
            }
        }
    </script>
</body>
</html>
