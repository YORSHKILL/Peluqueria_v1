<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peluquería Hombre - Reserva tu Hora</title>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Fuentes Elegantes Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #0a0a0a url('https://images.unsplash.com/photo-1503951914875-452162b0f3f1?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat fixed;
            color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 10px;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 0;
        }

        .main-wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
            max-width: 950px;
        }

        /* Postes de Barbero Clásicos */
        .barber-pole-wrapper {
            width: 55px;
            height: 520px;
            position: relative;
            flex-shrink: 0;
        }

        .barber-pole-cap-top, .barber-pole-cap-bottom {
            width: 65px;
            height: 35px;
            background: linear-gradient(135deg, #e6c875, #ffd700, #997a15);
            position: absolute;
            left: -5px;
            border-radius: 50% 50% 10% 10%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6), inset 0 2px 5px rgba(255,255,255,0.6);
            z-index: 3;
        }

        .barber-pole-cap-top { top: -15px; }
        .barber-pole-cap-bottom { bottom: -15px; border-radius: 10% 10% 50% 50%; }

        .barber-pole-glass {
            width: 100%;
            height: 100%;
            border-radius: 30px;
            overflow: hidden;
            border: 2px solid #d4af37;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.3), inset 0 0 15px rgba(0,0,0,0.8);
            position: relative;
            background: #fff;
        }

        .barber-pole-stripes {
            width: 100%;
            height: 200%;
            background: repeating-linear-gradient(
                -45deg,
                #cc1111,
                #cc1111 25px,
                #ffffff 25px,
                #ffffff 50px,
                #1144cc 50px,
                #1144cc 75px,
                #ffffff 75px,
                #ffffff 100px
            );
            animation: spinPole 5s linear infinite;
        }

        @keyframes spinPole {
            0% { transform: translateY(0); }
            100% { transform: translateY(-100px); }
        }

        /* Panel Central Prémia */
        .content-container {
            flex: 1;
            max-width: 540px;
            background: rgba(18, 18, 18, 0.92);
            backdrop-filter: blur(10px);
            padding: 35px 30px;
            border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(212, 175, 55, 0.1);
            position: relative;
        }

        .admin-trigger {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid #d4af37;
            color: #d4af37;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .admin-trigger:hover {
            background: #d4af37;
            color: #000;
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.6);
        }

        .admin-trigger.active {
            background: #81c784;
            color: #000;
            border-color: #81c784;
        }

        h1 {
            font-family: 'Cinzel', serif;
            text-align: center;
            font-size: 30px;
            color: #d4af37;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 2px;
            text-shadow: 0 2px 10px rgba(212, 175, 55, 0.3);
        }

        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #d4af37;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        input[type="text"], input[type="date"], select {
            width: 100%;
            padding: 12px 15px;
            background-color: rgba(30, 30, 30, 0.8);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            transition: all 0.3s;
        }

        input:focus, select:focus {
            border-color: #d4af37;
            outline: none;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
            background-color: rgba(40, 40, 40, 0.9);
        }

        .reserve-button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #d4af37, #aa820a);
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 10px;
            margin-bottom: 25px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        .reserve-button:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #ffe066, #d4af37);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.5);
        }

        /* Dashboard Admin */
        .dashboard-stats {
            background: rgba(30, 30, 30, 0.9);
            border: 1px solid #d4af37;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            display: none;
            justify-content: space-around;
        }

        .stat-box { text-align: center; }
        .stat-label { font-size: 10px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-size: 17px; font-weight: bold; color: #81c784; }

        /* Calendario */
        .calendar-section {
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            padding-top: 20px;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .nav-button {
            background-color: rgba(255, 255, 255, 0.05);
            color: #d4af37;
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .nav-button:hover {
            background-color: #d4af37;
            color: #000;
        }

        .calendar-title {
            font-family: 'Cinzel', serif;
            font-size: 16px;
            font-weight: bold;
            color: #d4af37;
            letter-spacing: 1px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .grid-header {
            text-align: center;
            font-weight: bold;
            font-size: 11px;
            color: #888;
            padding-bottom: 5px;
            text-transform: uppercase;
        }

        .grid-cell {
            padding: 10px 0;
            text-align: center;
            font-size: 13px;
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }

        .grid-cell:hover {
            border-color: #d4af37;
            background-color: rgba(212, 175, 55, 0.1);
        }

        .grid-cell.other-month {
            opacity: 0.15;
            cursor: default;
        }

        .grid-cell.selected {
            background: #d4af37 !important;
            color: #000 !important;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        .has-bookings::after {
            content: '';
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            background-color: #d4af37;
            border-radius: 50%;
        }

        .day-details {
            background-color: rgba(255, 255, 255, 0.02);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-top: 15px;
        }

        .day-details h4 {
            margin-bottom: 10px;
            font-size: 13px;
            color: #d4af37;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding-bottom: 6px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        #detailsContent { font-size: 13px; color: #aaa; }

        .booking-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(30, 30, 30, 0.8);
            padding: 10px 12px;
            border-radius: 6px;
            margin-bottom: 6px;
            border-left: 3px solid #d4af37;
        }

        .booking-info strong { color: #fff; display: block; font-size: 13px; }
        .booking-info small { color: #888; font-size: 11px; }

        .delete-btn {
            background-color: #c62828;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }

        @media (max-width: 650px) {
            .barber-pole-wrapper { display: none; }
            .content-container { padding: 25px 20px; }
        }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <!-- Poste Izquierdo -->
        <div class="barber-pole-wrapper">
            <div class="barber-pole-cap-top"></div>
            <div class="barber-pole-glass">
                <div class="barber-pole-stripes"></div>
            </div>
            <div class="barber-pole-cap-bottom"></div>
        </div>

        <div class="content-container">
            <button id="adminBtn" class="admin-trigger" onclick="toggleAdminMode()">🔒 Admin</button>

            <h1>Peluquería Hombre</h1>
            <p class="subtitle">Reserva tu cita en pocos segundos</p>

            <div class="dashboard-stats" id="adminDashboard">
                <div class="stat-box">
                    <div class="stat-label">Ingresos Hoy</div>
                    <div class="stat-value" id="ingresosDia">$0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label" id="nombreMesAnio">Ingresos Mes</div>
                    <div class="stat-value" id="ingresosMes">$0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Total Histórico</div>
                    <div class="stat-value" id="totales">$0</div>
                </div>
            </div>

            <form id="formReserva">
                <div class="form-group">
                    <label for="nombre">Nombre de Cliente</label>
                    <input type="text" id="nombre" placeholder="Ej. Juan Pérez" required>
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono de Contacto</label>
                    <input type="text" id="telefono" placeholder="Ej. +56912345678" required>
                </div>

                <div class="form-group">
                    <label for="servicio">Servicio a Realizar</label>
                    <select id="servicio" required>
                        <option value="">-- Selecciona un servicio --</option>
                        <option value="Corte de Cabello">Corte de Cabello ($8.000)</option>
                        <option value="Corte de Cabello / Barba">Corte de Cabello / Barba ($10.000)</option>
                    </select>
                </div>

                <div class="form-group" style="display: flex; gap: 10px;">
                    <div style="flex: 1;">
                        <label for="fecha">Fecha</label>
                        <input type="date" id="fecha" required>
                    </div>
                    <div style="flex: 1;">
                        <label for="hora">Hora</label>
                        <select id="hora" required>
                            <option value="">-- Elige hora --</option>
                            <option value="09:00">09:00 AM</option>
                            <option value="10:00">10:00 AM</option>
                            <option value="11:00">11:00 AM</option>
                            <option value="12:00">12:00 PM</option>
                            <option value="15:00">03:00 PM</option>
                            <option value="16:00">04:00 PM</option>
                            <option value="17:00">05:00 PM</option>
                            <option value="18:00">06:00 PM</option>
                            <option value="19:00">07:00 PM</option>
                            <option value="20:00">08:00 PM</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="reserve-button">Confirmar y Reservar Hora</button>
            </form>

            <div class="calendar-section">
                <div class="calendar-header">
                    <button class="nav-button" id="prevMonth">◀ Ant</button>
                    <div class="calendar-title" id="calendarTitle">Cargando...</div>
                    <button class="nav-button" id="nextMonth">Sig ▶</button>
                </div>

                <div class="calendar-grid" id="calendarGrid"></div>
            </div>

            <div class="day-details">
                <h4 id="detailsTitle">Selecciona un día en el calendario</h4>
                <div id="detailsContent">Haz clic sobre cualquier fecha para ver disponibilidades.</div>
            </div>
        </div>

        <!-- Poste Derecho -->
        <div class="barber-pole-wrapper">
            <div class="barber-pole-cap-top"></div>
            <div class="barber-pole-glass">
                <div class="barber-pole-stripes"></div>
            </div>
            <div class="barber-pole-cap-bottom"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://mfvxrdgkasahmfstcrhd.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_8IGgK5Uisvx-t91HWf1rIqw_Hp8h21zN3U3g3M3c5W6k7X"; 
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const ADMIN_PIN = "1234";
        let isAdminMode = false;
        let citas = [];
        let currentDate = new Date();
        let currentMonth = currentDate.getMonth();
        let currentYear = currentDate.getFullYear();
        let selectedDateStr = "";

        const mesesNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
        const diasSemana = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];

        window.addEventListener('DOMContentLoaded', async () => {
            const hoyStr = new Date().toISOString().split('T')[0];
            document.getElementById('fecha').min = hoyStr;

            document.getElementById('fecha').addEventListener('change', (e) => {
                const formDate = e.target.value;
                if (formDate) {
                    selectedDateStr = formDate;
                    const dateParts = formDate.split('-');
                    currentYear = parseInt(dateParts[0]);
                    currentMonth = parseInt(dateParts[1]) - 1;
                    renderCalendar();
                    mostrarDetallesDia(selectedDateStr);
                }
            });

            await cargarCitasDesdeSupabase();
        });

        window.toggleAdminMode = function() {
            const btn = document.getElementById('adminBtn');
            const dashboard = document.getElementById('adminDashboard');

            if (isAdminMode) {
                isAdminMode = false;
                btn.innerText = "🔒 Admin";
                btn.classList.remove('active');
                dashboard.style.display = "none";
                if (selectedDateStr) mostrarDetallesDia(selectedDateStr);
            } else {
                const pin = prompt("Ingresa el PIN de administración:");
                if (pin === ADMIN_PIN) {
                    isAdminMode = true;
                    btn.innerText = "🔓 Modo Admin";
                    btn.classList.add('active');
                    dashboard.style.display = "flex";
                    if (selectedDateStr) mostrarDetallesDia(selectedDateStr);
                } else if (pin !== null) {
                    alert("PIN incorrecto.");
                }
            }
        };

        async function cargarCitasDesdeSupabase() {
            const { data, error } = await supabase.from('reservas').select('*');
            if (error) { console.error("Error DB:", error); return; }
            citas = data || [];
            renderCalendar();
            calcularIngresosDashboard();
            if (selectedDateStr) mostrarDetallesDia(selectedDateStr);
        }

        document.getElementById('prevMonth').addEventListener('click', () => {
            currentMonth--;
            if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCalendar();
        });

        document.getElementById('nextMonth').addEventListener('click', () => {
            currentMonth++;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            renderCalendar();
        });

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            const title = document.getElementById('calendarTitle');
            grid.innerHTML = '';
            title.innerText = `${mesesNames[currentMonth]} ${currentYear}`;

            diasSemana.forEach(dia => {
                const dHeader = document.createElement('div');
                dHeader.className = 'grid-header';
                dHeader.innerText = dia;
                grid.appendChild(dHeader);
            });

            const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'grid-cell other-month';
                grid.appendChild(emptyCell);
            }

            for (let day = 1; day <= totalDays; day++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                cell.innerText = day;

                const fMonth = String(currentMonth + 1).padStart(2, '0');
                const fDay = String(day).padStart(2, '0');
                const dateStr = `${currentYear}-${fMonth}-${fDay}`;

                if (citas.some(c => c.fecha === dateStr)) {
                    cell.classList.add('has-bookings');
                }

                if (dateStr === selectedDateStr) {
                    cell.classList.add('selected');
                }

                cell.addEventListener('click', () => {
                    document.querySelectorAll('.grid-cell').forEach(el => el.classList.remove('selected'));
                    cell.classList.add('selected');
                    selectedDateStr = dateStr;
                    mostrarDetallesDia(dateStr);
                    document.getElementById('fecha').value = dateStr;
                });

                grid.appendChild(cell);
            }
        }

        function mostrarDetallesDia(dateStr) {
            const title = document.getElementById('detailsTitle');
            const content = document.getElementById('detailsContent');
            const [anio, mes, dia] = dateStr.split('-');
            title.innerText = `Horarios: ${dia}/${mes}/${anio}`;

            const filtradas = citas.filter(c => c.fecha === dateStr)
                                   .sort((a,b) => a.hora.localeCompare(b.hora));

            if (filtradas.length === 0) {
                content.innerHTML = "No hay reservas registradas para este día.";
                return;
            }

            content.innerHTML = '';
            filtradas.forEach(cita => {
                const item = document.createElement('div');
                item.className = 'booking-item';

                if (isAdminMode) {
                    item.innerHTML = `
                        <div class="booking-info">
                            <strong>⏰ ${cita.hora} hrs — ${cita.nombre}</strong>
                            <small>📞 ${cita.telefono} | 💇 ${cita.servicio}</small>
                        </div>
                        <button class="delete-btn" onclick="eliminarCita('${cita.id}')">Cancelar</button>
                    `;
                } else {
                    item.innerHTML = `
                        <div class="booking-info">
                            <strong>⏰ ${cita.hora} hrs — Horario Reservado</strong>
                            <small>No disponible</small>
                        </div>
                    `;
                }
                content.appendChild(item);
            });
        }

        function calcularIngresosDashboard() {
            let totalHoy = 0, totalMes = 0, totalHistorico = 0;
            const hoyStr = new Date().toISOString().split('T')[0];
            const mesActualStr = String(new Date().getMonth() + 1).padStart(2, '0');
            const anioActualStr = String(new Date().getFullYear());

            document.getElementById('nombreMesAnio').innerText = `Mes (${mesesNames[new Date().getMonth()]})`;

            citas.forEach(cita => {
                const valor = (cita.servicio.includes("Barba") || cita.servicio.includes("10.000")) ? 10000 : 8000;
                totalHistorico += valor;
                if (cita.fecha === hoyStr) totalHoy += valor;
                const [cAnio, cMes] = cita.fecha.split('-');
                if (cMes === mesActualStr && cAnio === anioActualStr) totalMes += valor;
            });

            document.getElementById('ingresosDia').innerText = `$${totalHoy.toLocaleString('es-CL')}`;
            document.getElementById('ingresosMes').innerText = `$${totalMes.toLocaleString('es-CL')}`;
            document.getElementById('totales').innerText = `$${totalHistorico.toLocaleString('es-CL')}`;
        }

        document.getElementById('formReserva').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nombre = document.getElementById('nombre').value;
            const telefono = document.getElementById('telefono').value;
            const servicio = document.getElementById('servicio').value;
            const fecha = document.getElementById('fecha').value;
            const hora = document.getElementById('hora').value;

            if (citas.some(c => c.fecha === fecha && c.hora === hora)) {
                alert("Este horario ya está ocupado.");
                return;
            }

            const { error } = await supabase.from('reservas').insert([{ nombre, telefono, servicio, fecha, hora }]);
            if (error) { alert("Error: " + error.message); return; }

            alert("¡Cita agendada con éxito!");
            document.getElementById('formReserva').reset();
            await cargarCitasDesdeSupabase();
        });

        window.eliminarCita = async function(id) {
            if (confirm("¿Cancelar esta reserva?")) {
                const { error } = await supabase.from('reservas').delete().eq('id', id);
                if (error) { alert("Error: " + error.message); return; }
                await cargarCitasDesdeSupabase();
            }
        }
    </script>
</body>
</html>
