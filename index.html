<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva tu Hora - Peluquería VIP & Admin</title>
    <!-- Importación de fuentes elegantes desde Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Estilos generales con ambiente oscuro y premium */
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at center, #1e1e1e 0%, #0f0f0f 100%);
            margin: 0;
            padding: 20px;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        /* Botón de Acceso Admin flotante */
        .admin-trigger-container {
            width: 100%;
            max-width: 650px;
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }

        .btn-admin-login {
            background: rgba(30, 30, 30, 0.8);
            border: 1px solid rgba(197, 168, 128, 0.4);
            color: #c5a880;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            width: auto;
            box-shadow: none;
        }

        .btn-admin-login:hover {
            background: #c5a880;
            color: #111111;
            box-shadow: 0 0 10px rgba(197, 168, 128, 0.3);
        }

        .container {
            max-width: 650px;
            width: 100%;
            background: rgba(23, 23, 23, 0.95);
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(197, 168, 128, 0.2); 
            box-sizing: border-box;
        }

        /* --- CONTENEDOR DEL ENCABEZADO CON LOS POSTES --- */
        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px; 
            margin-bottom: 5px;
        }

        h1 {
            font-family: 'Cinzel', serif;
            text-align: center;
            color: #c5a880; 
            margin: 0;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        p.subtitle {
            font-family: 'Inter', sans-serif;
            text-align: center;
            color: #8a8a8a;
            font-weight: 300;
            letter-spacing: 1px;
            margin-top: 8px;
            margin-bottom: 35px;
        }

        /* --- POSTE DE BARBERÍA MINIATURA --- */
        .barber-pole {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            flex-shrink: 0;
        }

        .metal-cap {
            width: 25px;
            height: 25px;
            background: radial-gradient(circle at 45% 35%, #ffffff 0%, #e1e1e1 25%, #9e9e9e 60%, #4a4a4a 100%);
            border: 2px solid #000;
            border-radius: 50%;
            box-sizing: border-box;
            z-index: 2;
        }

        .metal-connector {
            width: 31px;
            height: 8px;
            background: linear-gradient(to right, #4a4a4a, #8e8e8e 15%, #ffffff 40%, #e1e1e1 60%, #8e8e8e 85%, #4a4a4a);
            border: 2px solid #000;
            border-radius: 2px;
            box-sizing: border-box;
            z-index: 3;
        }

        .top-connector {
            margin-top: -6px;
            margin-bottom: -2px;
        }

        .bottom-connector {
            margin-bottom: -6px;
            margin-top: -2px;
        }

        .glass-cylinder {
            width: 27px;
            height: 70px;
            border-left: 2px solid #000;
            border-right: 2px solid #000;
            position: relative;
            overflow: hidden;
            background-color: #fff;
            z-index: 1;
            box-sizing: border-box;
        }

        .stripes {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background: repeating-linear-gradient(
                135deg,
                #9b111e,          
                #9b111e 8px,
                #ffffff 8px,     
                #ffffff 16px,
                #124076 16px,     
                #124076 24px,
                #ffffff 24px,    
                #ffffff 32px
            );
            background-size: 100% 45.25px; 
            animation: rotate-pole 1.8s linear infinite;
        }

        .glass-shine {
            position: absolute;
            top: 0;
            left: 18%;
            width: 5px;
            height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0.75) 0%, rgba(255,255,255,0) 100%);
            z-index: 4;
            pointer-events: none;
        }

        .glass-shadow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, 
                rgba(0,0,0,0.3) 0%, 
                rgba(0,0,0,0) 15%, 
                rgba(0,0,0,0) 85%, 
                rgba(0,0,0,0.35) 100%
            );
            z-index: 3;
            pointer-events: none;
        }

        @keyframes rotate-pole {
            from { background-position: 0 0; }
            to { background-position: 0 -45.25px; }
        }

        /* --- ESTILOS DEL FORMULARIO VIP --- */
        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-weight: 500;
            font-size: 14px;
            margin-bottom: 8px;
            color: #c5a880; 
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        input, select {
            width: 100%;
            padding: 14px;
            background-color: rgba(30, 30, 30, 0.8);
            border: 1px solid rgba(197, 168, 128, 0.3);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: #666;
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1) sepia(50%) saturate(1000%) hue-rotate(330deg);
            cursor: pointer;
        }

        input:focus, select:focus {
            border-color: #c5a880;
            box-shadow: 0 0 10px rgba(197, 168, 128, 0.2);
            outline: none;
            background-color: rgba(40, 40, 40, 0.9);
        }

        select option:disabled {
            color: #555555;
            background-color: #1a1a1a;
            font-style: italic;
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, #c5a880 0%, #a3855c 100%);
            color: #111111;
            padding: 16px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(197, 168, 128, 0.2);
        }

        button:hover {
            background: linear-gradient(135deg, #dbbe96 0%, #b8986c 100%);
            box-shadow: 0 6px 20px rgba(197, 168, 128, 0.4);
            transform: translateY(-1px);
        }

        /* --- SECCIÓN DEL PANEL DE ADMINISTRACIÓN (VIP CONTROL) --- */
        .admin-panel {
            display: none; /* Oculto por defecto */
            margin-top: 35px;
            background: rgba(30, 25, 20, 0.6);
            border: 1px dashed #c5a880;
            border-radius: 12px;
            padding: 25px;
            box-sizing: border-box;
        }

        .admin-panel h3 {
            font-family: 'Cinzel', serif;
            color: #c5a880;
            margin-top: 0;
            font-size: 20px;
            border-bottom: 1px solid rgba(197, 168, 128, 0.3);
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid rgba(197, 168, 128, 0.1);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-card span {
            display: block;
            font-size: 12px;
            color: #8a8a8a;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .stat-card strong {
            font-size: 20px;
            color: #ffffff;
            font-family: 'Cinzel', serif;
        }

        .btn-close-month {
            background: #9b111e;
            color: white;
            font-weight: bold;
            font-size: 13px;
            padding: 10px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            box-shadow: none;
            width: auto;
            text-transform: uppercase;
        }

        .btn-close-month:hover {
            background: #be1829;
            box-shadow: 0 4px 12px rgba(155, 17, 30, 0.4);
        }

        /* Historial de cierres de mes */
        .closures-history {
            margin-top: 15px;
            background: rgba(15, 15, 15, 0.9);
            border-radius: 8px;
            padding: 12px;
            max-height: 120px;
            overflow-y: auto;
        }

        .closure-item {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding: 6px 0;
        }

        .closure-item:last-child {
            border-bottom: none;
        }

        /* --- SECCIÓN DEL CALENDARIO --- */
        .calendar-section {
            margin-top: 45px;
            border-top: 1px solid rgba(197, 168, 128, 0.2);
            padding-top: 35px;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .calendar-header h3 {
            font-family: 'Cinzel', serif;
            color: #ffffff;
            margin: 0;
            font-size: 18px;
            letter-spacing: 1px;
        }

        .calendar-header button {
            width: auto;
            padding: 8px 16px;
            font-size: 12px;
            background: rgba(30, 30, 30, 0.8);
            border: 1px solid rgba(197, 168, 128, 0.3);
            color: #c5a880;
            box-shadow: none;
        }

        .calendar-header button:hover {
            background: #c5a880;
            color: #111111;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            text-align: center;
        }

        .day-name {
            font-weight: 600;
            color: #c5a880;
            padding: 5px 0;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .calendar-day {
            background: rgba(35, 35, 35, 0.6);
            color: #cccccc;
            padding: 12px 0;
            border-radius: 8px;
            cursor: pointer;
            position: relative;
            font-weight: 500;
            font-size: 14px;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .calendar-day:hover {
            background: rgba(197, 168, 128, 0.15);
            border-color: rgba(197, 168, 128, 0.3);
            color: #ffffff;
        }

        .calendar-day.empty {
            background: transparent;
            cursor: default;
            border: none;
        }

        .calendar-day.selected {
            background: #c5a880 !important;
            color: #111111 !important;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(197, 168, 128, 0.3);
        }

        .has-bookings::after {
            content: '';
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 5px;
            height: 5px;
            background-color: #ff3333;
            border-radius: 50%;
            box-shadow: 0 0 6px #ff3333;
        }

        /* Detalle del día seleccionado */
        .day-details {
            margin-top: 30px;
            background: rgba(26, 26, 26, 0.8);
            border: 1px solid rgba(197, 168, 128, 0.2);
            border-radius: 10px;
            padding: 22px;
        }

        .day-details h4 {
            font-family: 'Cinzel', serif;
            margin-top: 0;
            color: #c5a880;
            border-bottom: 1px solid rgba(197, 168, 128, 0.3);
            padding-bottom: 12px;
            font-size: 16px;
            letter-spacing: 1px;
        }

        .booking-list-item {
            background: rgba(35, 35, 35, 0.9);
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #c5a880;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .booking-list-item strong { color: #ffffff; }
        .booking-list-item small { color: #8a8a8a; }

        .no-bookings {
            color: #8a8a8a;
            font-style: italic;
            font-size: 14px;
        }

        /* Botón de eliminar oculto para clientes, se muestra solo a admins */
        .delete-btn {
            display: none; 
            background: transparent;
            color: #ef5350;
            border: 1px solid rgba(239, 83, 80, 0.4);
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            cursor: pointer;
            width: auto;
            transition: all 0.2s ease;
        }

        .delete-btn:hover {
            background: #ef5350;
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(239, 83, 80, 0.3);
        }

        /* Clase helper para forzar visibilidad del botón eliminar */
        body.admin-mode-active .delete-btn {
            display: block !important;
        }
    </style>
</head>
<body>

<!-- Acceso Admin superior -->
<div class="admin-trigger-container">
    <button id="adminLoginBtn" class="btn-admin-login" onclick="toggleAdminAccess()">🔑 Acceso Admin</button>
</div>

<div class="container">
    <div class="header-container">
        <div class="barber-pole" aria-hidden="true">
            <div class="metal-cap"></div>
            <div class="metal-connector top-connector"></div>
            <div class="glass-cylinder">
                <div class="stripes"></div>
                <div class="glass-shine"></div>
                <div class="glass-shadow"></div>
            </div>
            <div class="metal-connector bottom-connector"></div>
            <div class="metal-cap"></div>
        </div>

        <h1>Peluquería Hombre</h1>

        <div class="barber-pole" aria-hidden="true">
            <div class="metal-cap"></div>
            <div class="metal-connector top-connector"></div>
            <div class="glass-cylinder">
                <div class="stripes"></div>
                <div class="glass-shine"></div>
                <div class="glass-shadow"></div>
            </div>
            <div class="metal-connector bottom-connector"></div>
            <div class="metal-cap"></div>
        </div>
    </div>

    <p class="subtitle">Reserva tu cita en pocos segundos</p>

    <!-- Formulario de Reserva -->
    <form id="formReserva">
        <div class="form-group">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" placeholder="Ej. Juan Pérez" required>
        </div>

        <div class="form-group">
            <label for="telefono">Teléfono:</label>
            <input type="text" id="telefono" placeholder="Ej. 981901260" required>
        </div>

        <div class="form-group">
            <label for="servicio">Selecciona el Servicio:</label>
            <select id="servicio" required>
                <option value="">-- Selecciona --</option>
                <option value="Corte de Cabello">Corte de Cabello $8.000</option>
                <option value="Corte de Cabello / Afeitado">Corte de Cabello/Barba $10.000</option>
            </select>
        </div>

        <div class="form-group">
            <label for="fecha">Fecha:</label>
            <input type="date" id="fecha" required>
        </div>

        <div class="form-group">
            <label for="hora">Hora:</label>
            <select id="hora" required disabled>
                <option value="">-- Primero selecciona una fecha --</option>
                <option value="09:00">09:00 AM</option>
                <option value="10:00">10:00 AM</option>
                <option value="11:00">11:00 AM</option>
                <option value="12:00">12:00 PM</option>
                <option value="15:00">03:00 PM</option>
                <option value="16:00">04:00 PM</option>
                <option value="17:00">05:00 PM</option>
                <option value="18:00">06:00 PM</option>
                <option value="19:00">07:00 PM</option>
                <option value="20:00">08:00 PM</option>
            </select>
        </div>

        <button type="submit">Reservar Hora</button>
    </form>

    <!-- PANEL EXCLUSIVO PARA ADMINISTRADOR -->
    <div id="adminPanel" class="admin-panel">
        <h3>💰 Panel de Control VIP <button class="btn-close-month" onclick="cerrarMesActual()">Cerrar Mes</button></h3>
        
        <div class="admin-stats-grid">
            <div class="stat-card">
                <span>Ingreso Día Seleccionado</span>
                <strong id="diaIngresos">$0</strong>
            </div>
            <div class="stat-card">
                <span>Ingreso Estimado Mes</span>
                <strong id="mesIngresos">$0</strong>
            </div>
        </div>

        <span style="font-size: 11px; text-transform: uppercase; color: #c5a880; font-weight: 600;">Historial de Cierres</span>
        <div class="closures-history" id="closuresHistory">
            <!-- Cierres mensuales listados dinámicamente -->
        </div>
    </div>

    <!-- Sección de Calendario Dinámico -->
    <div class="calendar-section">
        <div class="calendar-header">
            <button id="prevMonth">◀ Anterior</button>
            <h3 id="calendarMonthYear">Mes Año</h3>
            <button id="nextMonth">Siguiente ▶</button>
        </div>
        
        <div class="calendar-grid" id="calendarGrid">
            <!-- Días de la semana y celdas numéricas se inyectan con JS -->
        </div>

        <!-- Panel de Detalle del Día Seleccionado -->
        <div class="day-details" id="dayDetails">
            <h4 id="selectedDayTitle">Selecciona un día para ver las reservas</h4>
            <div id="selectedDayBookings">
                <p class="no-bookings">Haz clic en cualquier día del calendario con un punto rojo para ver qué horas están ocupadas.</p>
            </div>
        </div>
    </div>
</div>

<script>
    // Configuración base de datos local
    let citas = JSON.parse(localStorage.getItem('citas_peluqueria')) || [];
    let cierres = JSON.parse(localStorage.getItem('cierres_caja')) || [];
    let isAdminMode = false;

    // Valores constantes de servicios
    const preciosServicios = {
        "Corte de Cabello": 8000,
        "Corte de Cabello / Afeitado": 10000
    };

    const horariosDisponibles = [
        { valor: "09:00", texto: "09:00 AM" },
        { valor: "10:00", texto: "10:00 AM" },
        { valor: "11:00", texto: "11:00 AM" },
        { valor: "12:00", texto: "12:00 PM" },
        { valor: "15:00", texto: "03:00 PM" },
        { valor: "16:00", texto: "04:00 PM" },
        { valor: "17:00", texto: "05:00 PM" },
        { valor: "18:00", texto: "06:00 PM" },
        { valor: "19:00", texto: "07:00 PM" },
        { valor: "20:00", texto: "08:00 PM" }
    ];

    // Calendario
    let currentClientDate = new Date();
    let currentMonth = currentClientDate.getMonth();
    let currentYear = currentClientDate.getFullYear();
    let selectedDateString = ""; 

    const meses = [
        "Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", 
        "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"
    ];
    const diasSemana = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];

    window.addEventListener('DOMContentLoaded', () => {
        renderCalendar();
        renderCierresHistorial();
        const hoy = new Date().toISOString().split('T')[0];
        document.getElementById('fecha').min = hoy;
    });

    // Control de acceso de Administrador
    function toggleAdminAccess() {
        if (!isAdminMode) {
            const password = prompt("Introduce la contraseña de Administrador:");
            if (password === "admin123") { // Puedes cambiar "admin123" por tu contraseña deseada
                isAdminMode = true;
                document.body.classList.add('admin-mode-active');
                document.getElementById('adminPanel').style.display = "block";
                document.getElementById('adminLoginBtn').innerText = "🔒 Salir Admin";
                actualizarCalculosMonetarios();
                alert("Modo Administrador activado. Controles de ingresos y eliminación desbloqueados.");
            } else {
                alert("Contraseña incorrecta.");
            }
        } else {
            isAdminMode = false;
            document.body.classList.remove('admin-mode-active');
            document.getElementById('adminPanel').style.display = "none";
            document.getElementById('adminLoginBtn').innerText = "🔑 Acceso Admin";
        }
        if (selectedDateString) {
            mostrarDetalleDia(selectedDateString);
        }
    }

    // Calcula ingresos de un día específico
    function calcularIngresoDia(fechaStr) {
        return citas
            .filter(cita => cita.fecha === fechaStr)
            .reduce((total, cita) => total + (preciosServicios[cita.servicio] || 0), 0);
    }

    // Calcula ingresos del mes seleccionado en el calendario
    function calcularIngresoMes(mesIndex, anio) {
        const prefijoMes = `${anio}-${String(mesIndex + 1).padStart(2, '0')}`;
        return citas
            .filter(cita => cita.fecha.startsWith(prefijoMes))
            .reduce((total, cita) => total + (preciosServicios[cita.servicio] || 0), 0);
    }

    // Actualiza la visualización de los ingresos en el Panel de Administración
    function actualizarCalculosMonetarios() {
        if (!isAdminMode) return;

        // Ingresos del día seleccionado
        const ingresosDia = selectedDateString ? calcularIngresoDia(selectedDateString) : 0;
        document.getElementById('diaIngresos').innerText = `$${ingresosDia.toLocaleString('es-CL')}`;

        // Ingresos del mes actual del calendario
        const ingresosMes = calcularIngresoMes(currentMonth, currentYear);
        document.getElementById('mesIngresos').innerText = `$${ingresosMes.toLocaleString('es-CL')}`;
    }

    // Cierre de mes definitivo
    function cerrarMesActual() {
        const totalMes = calcularIngresoMes(currentMonth, currentYear);
        const nombreMesAnio = `${meses[currentMonth]} ${currentYear}`;

        if (totalMes === 0) {
            alert(`No hay registros de ingresos para archivar en ${nombreMesAnio}.`);
            return;
        }

        if (confirm(`¿Estás seguro de que deseas cerrar la caja de ${nombreMesAnio}? Se registrará un ingreso total de $${totalMes.toLocaleString('es-CL')} y se limpiarán estas citas activas.`)) {
            // Guardar en el historial de cierres
            const nuevoCierre = {
                id: 'cierre_' + Date.now(),
                periodo: nombreMesAnio,
                total: totalMes,
                fechaCierre: new Date().toLocaleDateString('es-CL')
            };
            cierres.push(nuevoCierre);
            localStorage.setItem('cierres_caja', JSON.stringify(cierres));

            // Filtrar y eliminar las citas pertenecientes al mes cerrado para liberar espacio y agilizar el calendario
            const prefijoMes = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}`;
            citas = citas.filter(cita => !cita.fecha.startsWith(prefijoMes));
            localStorage.setItem('citas_peluqueria', JSON.stringify(citas));

            // Resetear estados visuales
            selectedDateString = "";
            renderCalendar();
            renderCierresHistorial();
            actualizarCalculosMonetarios();
            
            // Limpiar detalle del día
            document.getElementById('selectedDayTitle').innerText = "Selecciona un día para ver las reservas";
            document.getElementById('selectedDayBookings').innerHTML = '<p class="no-bookings">Haz clic en cualquier día del calendario con un punto rojo para ver qué horas están ocupadas.</p>';
            
            alert(`Caja cerrada con éxito. El historial ha sido archivado de manera segura.`);
        }
    }

    // Render del historial de cierres
    function renderCierresHistorial() {
        const contenedor = document.getElementById('closuresHistory');
        contenedor.innerHTML = '';
        if (cierres.length === 0) {
            contenedor.innerHTML = '<p style="color: #666; font-size:11px; margin:0;">No se registran cierres previos.</p>';
            return;
        }
        cierres.forEach(cierre => {
            const div = document.createElement('div');
            div.classList.add('closure-item');
            div.innerHTML = `
                <span>📅 ${cierre.periodo} (Cerrado: ${cierre.fechaCierre})</span>
                <strong style="color:#c5a880;">+$${cierre.total.toLocaleString('es-CL')}</strong>
            `;
            contenedor.appendChild(div);
        });
    }

    // Sincronización del selector de horas
    document.getElementById('fecha').addEventListener('change', function() {
        actualizarSelectHoras(this.value);
    });

    function actualizarSelectHoras(fechaSeleccionada) {
        const horaSelect = document.getElementById('hora');
        
        if (!fechaSeleccionada) {
            horaSelect.disabled = true;
            horaSelect.innerHTML = '<option value="">-- Primero selecciona una fecha --</option>';
            return;
        }

        const horasOcupadas = citas.filter(cita => cita.fecha === fechaSeleccionada).map(cita => cita.hora);
        let opcionesHtml = '<option value="">-- Selecciona la hora --</option>';
        
        horariosDisponibles.forEach(horario => {
            const estaOcupado = horasOcupadas.includes(horario.valor);
            if (estaOcupado) {
                opcionesHtml += `<option value="${horario.valor}" disabled>${horario.texto} (Ocupado)</option>`;
            } else {
                opcionesHtml += `<option value="${horario.valor}">${horario.texto}</option>`;
            }
        });

        horaSelect.innerHTML = opcionesHtml;
        horaSelect.disabled = false;
    }

    // Control de meses calendario
    document.getElementById('prevMonth').addEventListener('click', () => {
        currentMonth--;
        if (currentMonth < 0) {
            currentMonth = 11;
            currentYear--;
        }
        renderCalendar();
        actualizarCalculosMonetarios();
    });

    document.getElementById('nextMonth').addEventListener('click', () => {
        currentMonth++;
        if (currentMonth > 11) {
            currentMonth = 0;
            currentYear++;
        }
        renderCalendar();
        actualizarCalculosMonetarios();
    });

    // Renderizado del calendario
    function renderCalendar() {
        const grid = document.getElementById('calendarGrid');
        const title = document.getElementById('calendarMonthYear');
        
        grid.innerHTML = ''; 
        title.innerText = `${meses[currentMonth]} ${currentYear}`;

        diasSemana.forEach(dia => {
            const dayNameDiv = document.createElement('div');
            dayNameDiv.classList.add('day-name');
            dayNameDiv.innerText = dia;
            grid.appendChild(dayNameDiv);
        });

        const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
        const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

        for (let i = 0; i < firstDayIndex; i++) {
            const emptyDiv = document.createElement('div');
            emptyDiv.classList.add('calendar-day', 'empty');
            grid.appendChild(emptyDiv);
        }

        for (let day = 1; day <= totalDays; day++) {
            const dayDiv = document.createElement('div');
            dayDiv.classList.add('calendar-day');
            dayDiv.innerText = day;

            const formattedMonth = String(currentMonth + 1).padStart(2, '0');
            const formattedDay = String(day).padStart(2, '0');
            const dateStr = `${currentYear}-${formattedMonth}-${formattedDay}`;
            dayDiv.dataset.date = dateStr;

            const tieneCitas = citas.some(cita => cita.fecha === dateStr);
            if (tieneCitas) {
                dayDiv.classList.add('has-bookings');
            }

            if (dateStr === selectedDateString) {
                dayDiv.classList.add('selected');
            }

            dayDiv.addEventListener('click', () => {
                document.querySelectorAll('.calendar-day').forEach(el => el.classList.remove('selected'));
                dayDiv.classList.add('selected');
                selectedDateString = dateStr;
                
                document.getElementById('fecha').value = dateStr;
                actualizarSelectHoras(dateStr);
                
                mostrarDetalleDia(dateStr);
                actualizarCalculosMonetarios();
            });

            grid.appendChild(dayDiv);
        }
    }

    // Mostrar detalles de reservas por día seleccionado
    function mostrarDetalleDia(fechaStr) {
        const title = document.getElementById('selectedDayTitle');
        const container = document.getElementById('selectedDayBookings');
        
        const [anio, mes, dia] = fechaStr.split('-');
        title.innerText = `Citas para el ${dia}/${mes}/${anio}`;

        const citasDelDia = citas.filter(cita => cita.fecha === fechaStr)
                                 .sort((a, b) => a.hora.localeCompare(b.hora));

        container.innerHTML = '';

        if (citasDelDia.length === 0) {
            container.innerHTML = '<p class="no-bookings">No hay citas agendadas para este día. ¡Todo disponible!</p>';
            return;
        }

        citasDelDia.forEach(cita => {
            const item = document.createElement('div');
            item.classList.add('booking-list-item');
            
            // Los precios se leen del objeto de precios en JS para evitar alterar la base de datos
            const precioFormateado = (preciosServicios[cita.servicio] || 0).toLocaleString('es-CL');
            
            item.innerHTML = `
                <div>
                    <strong>⏰ ${cita.hora} hrs</strong> - ${cita.nombre} <br>
                    <small>💇 ${cita.servicio} ($${precioFormateado})</small>
                </div>
                <button class="delete-btn" onclick="cancelarCita('${cita.id}', '${fechaStr}')">Eliminar</button>
            `;
            container.appendChild(item);
        });
    }

    // Procesar envío de reserva nueva
    document.getElementById('formReserva').addEventListener('submit', function(e) {
        e.preventDefault();

        const nombre = document.getElementById('nombre').value.trim();
        const servicio = document.getElementById('servicio').value;
        const fecha = document.getElementById('fecha').value;
        const hora = document.getElementById('hora').value;

        const horaOcupada = citas.some(cita => cita.fecha === fecha && cita.hora === hora);

        if (horaOcupada) {
            alert(`Lo sentimos, la hora ${hora} ya está ocupada.`);
            return;
        }

        const nuevaCita = {
            id: 'id_' + Math.random().toString(36).substr(2, 9),
            nombre,
            servicio,
            fecha,
            hora
        };

        citas.push(nuevaCita);
        localStorage.setItem('citas_peluqueria', JSON.stringify(citas));

        renderCalendar();
        actualizarSelectHoras(fecha);
        actualizarCalculosMonetarios();
        
        if (fecha === selectedDateString) {
            mostrarDetalleDia(fecha);
        } else {
            selectedDateString = fecha;
            const fechaReserva = new Date(fecha + 'T00:00:00');
            currentMonth = fechaReserva.getMonth();
            currentYear = fechaReserva.getFullYear();
            renderCalendar();
            mostrarDetalleDia(fecha);
        }

        document.getElementById('formReserva').reset();
        document.getElementById('hora').disabled = true;
        document.getElementById('hora').innerHTML = '<option value="">-- Primero selecciona una fecha --</option>';
        
        alert('¡Reserva registrada con éxito!');
    });

    // Eliminación de citas (Disponible solo para administrador)
    window.cancelarCita = function(id, fechaCita) {
        if (!isAdminMode) {
            alert("Acceso denegado. Solo un administrador puede eliminar citas.");
            return;
        }

        if (confirm('¿Estás seguro de que deseas cancelar y eliminar esta reserva?')) {
            citas = citas.filter(cita => cita.id !== id);
            localStorage.setItem('citas_peluqueria', JSON.stringify(citas));
            
            renderCalendar();
            
            if (document.getElementById('fecha').value === fechaCita) {
                actualizarSelectHoras(fechaCita);
            }
            
            if (selectedDateString) {
                mostrarDetalleDia(selectedDateString);
            }
            actualizarCalculosMonetarios();
        }
    }
</script>
